workflows:
  android_release:
    name: RAJA ENTERPRISE Android APK
    instance_type: mac_mini_m2

    environment:
      flutter: stable

    scripts:
      - name: Generate Android project
        script: |
          flutter create \
            --platforms=android \
            --project-name raja_enterprise_stock \
            .

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Analyze project
        script: |
          flutter analyze

      - name: Build release APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
