workflows:

  android_release:
    name: RAJA ENTERPRISE Android APK
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable

    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"

      - name: Generate Android Gradle wrapper
        script: |
          rm -rf /tmp/raja_android_template

          flutter create \
            --platforms=android \
            --project-name raja_enterprise_stock \
            /tmp/raja_android_template

          cp /tmp/raja_android_template/android/gradlew \
            "$CM_BUILD_DIR/android/gradlew"

          cp /tmp/raja_android_template/android/gradlew.bat \
            "$CM_BUILD_DIR/android/gradlew.bat"

          rm -rf "$CM_BUILD_DIR/android/gradle"

          cp -R /tmp/raja_android_template/android/gradle \
            "$CM_BUILD_DIR/android/gradle"

          chmod +x "$CM_BUILD_DIR/android/gradlew"

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Build Android APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk


  ios_unsigned:
    name: RAJA ENTERPRISE iPhone Test Build
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Generate iOS platform
        script: |
          flutter create --platforms=ios .

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Install CocoaPods
        script: |
          find ios -name "Podfile" -execdir pod install \;

      - name: Build iOS without signing
        script: |
          flutter build ios --release --no-codesign

    artifacts:
      - build/ios/iphoneos/**/*.app
      - /tmp/xcodebuild_logs/*.log


  windows_release:
    name: RAJA ENTERPRISE Windows
    instance_type: windows_x2
    max_build_duration: 60

    environment:
      flutter: stable

    scripts:
      - name: Generate Windows platform
        script: |
          flutter create --platforms=windows .

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Build Windows
        script: |
          flutter build windows --release

    artifacts:
      - build/windows/x64/runner/Release/**
