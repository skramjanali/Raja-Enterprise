name: RAJA ENTERPRISE Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  windows-build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows platform
        run: flutter create --platforms=windows .

      - name: Get packages
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: RAJA-ENTERPRISE-Windows
          path: build/windows/x64/runner/Release/
