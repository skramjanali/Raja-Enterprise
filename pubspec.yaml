name: raja_enterprise_stock
description: RAJA ENTERPRISE premium stock management app.
publish_to: "none"

version: 1.1.0+3

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.6.0

  pdf: ^3.11.3
  printing: ^5.14.2

  # Keep only if another part of the app uses file picking.
  file_picker: ^13.1.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/raja_logo.png
